name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm run test:unit -- --passWithNoTests
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info

  build-api:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Build API Gateway
        working-directory: ./apps/api-gateway
        run: |
          npm ci
          npm run build
      
      - name: Build Docker image
        working-directory: ./apps/api-gateway
        run: docker build -t fangtan-ai-api:${{ github.sha }} .
      
      - name: Push API image
        if: github.ref == 'refs/heads/main'
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker tag fangtan-ai-api:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/fangtan-ai-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/fangtan-ai-api:latest

  build-web:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Build Web
        working-directory: ./apps/web
        run: |
          npm ci
          npm run build
      
      - name: Build Docker image
        working-directory: ./apps/web
        run: docker build -t fangtan-ai-web:${{ github.sha }} .
      
      - name: Push Web image
        if: github.ref == 'refs/heads/main'
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker tag fangtan-ai-web:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/fangtan-ai-web:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/fangtan-ai-web:latest

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Deploy to Staging
        run: |
          echo "Deploying to staging environment..."
          # Add deployment commands here
          # kubectl apply -f k8s/staging/
          # or docker-compose -f docker-compose.staging.yml up -d

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Production
        run: |
          echo "Deploying to production environment..."
          # Add deployment commands here
          # kubectl apply -f k8s/production/
          # or docker-compose -f docker-compose.production.yml up -d
