name: FangTan AI CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. 代码检查和测试
  check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linting
        run: npm run lint
      
      - name: Run type check
        run: npm run type-check
      
      - name: Run build
        run: npm run build

  # 2. 前端构建和测试
  frontend-test:
    runs-on: ubuntu-latest
    needs: check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          working-directory: ./apps/web
      
      - name: Install dependencies
        run: npm ci
        working-directory: ./apps/web
      
      - name: Run build
        run: npm run build
        working-directory: ./apps/web

  # 3. 部署到阿里云服务器 (仅main分支推送时)
  deploy:
    runs-on: ubuntu-latest
    needs: [check, frontend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Deploy to Aliyun Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALIYUN_SERVER_IP }}
          username: ${{ secrets.ALIYUN_SERVER_USER }}
          key: ${{ secrets.ALIYUN_SERVER_SSH_KEY }}
          script: |
            cd /opt/fangtan-ai
            
            # 备份当前版本
            cp docker-compose.production.yml docker-compose.production.yml.backup.$(date +%Y%m%d-%H%M%S)
            
            # 拉取最新代码
            git checkout main
            git pull origin main
            
            # 停止旧服务
            docker-compose -f docker-compose.production.yml down
            
            # 启动新服务
            docker-compose -f docker-compose.production.yml up -d --build
            
            # 等待服务启动
            sleep 30
            
            # 检查服务状态
            docker-compose -f docker-compose.production.yml ps
            
            # 检查健康状态
            curl -f http://localhost:3000/health || exit 1
            
            echo "Deployment completed successfully!"
