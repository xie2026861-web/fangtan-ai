apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fangtan-ingress
  namespace: fangtan-ai
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.fangtan.ai wss://api.fangtan.ai;";
spec:
  tls:
    - hosts:
        - fangtan.ai
        - www.fangtan.ai
        - api.fangtan.ai
      secretName: fangtan-tls
  rules:
    - host: fangtan.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fangtan-web
                port:
                  number: 80
    - host: www.fangtan.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fangtan-web
                port:
                  number: 80
    - host: api.fangtan.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fangtan-api-gateway
                port:
                  number: 3001
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: k8s.io/ingress-nginx
