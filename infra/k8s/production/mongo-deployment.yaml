apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fangtan-mongo
  namespace: fangtan-ai
  labels:
    app: fangtan-mongo
    version: v1
spec:
  serviceName: fangtan-mongo
  replicas: 1
  selector:
    matchLabels:
      app: fangtan-mongo
  template:
    metadata:
      labels:
        app: fangtan-mongo
        version: v1
    spec:
      containers:
        - name: mongo
          image: mongo:6-alpine
          ports:
            - containerPort: 27017
              name: tcp-mongo
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "fangtan"
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fangtan-secrets
                  key: MONGO_PASSWORD
            - name: MONGO_INITDB_DATABASE
              value: "fangtan"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: fangtan-mongo-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fangtan-mongo-pvc
  namespace: fangtan-ai
  labels:
    app: fangtan-mongo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: cloud-ssd
---
apiVersion: v1
kind: Service
metadata:
  name: fangtan-mongo
  namespace: fangtan-ai
  labels:
    app: fangtan-mongo
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: 27017
      protocol: TCP
      name: tcp-mongo
  selector:
    app: fangtan-mongo
