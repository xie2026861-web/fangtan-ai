apiVersion: v1
kind: Secret
metadata:
  name: fangtan-secrets
  namespace: fangtan-ai
type: Opaque
stringData:
  # 数据库密码
  DATABASE_PASSWORD: "fangtan_secure_password"
  REDIS_PASSWORD: "fangtan_redis_password"
  MONGO_PASSWORD: "fangtan_mongo_password"
  
  # JWT密钥
  JWT_SECRET: "your-production-jwt-secret-key-at-least-32-chars"
  
  # API Keys
  OPENAI_API_KEY: "sk-your-openai-key"
  ANTHROPIC_API_KEY: "sk-ant-your-anthropic-key"
  
  # 高德地图
  AMAP_KEY: "your-amap-key"
  
  # 企业微信
  WECHAT_CORP_ID: "your-corp-id"
  WECHAT_AGENT_SECRET: "your-agent-secret"
  
  # 阿里云
  ALIYUN_ACCESS_KEY_ID: "your-access-key-id"
  ALIYUN_ACCESS_KEY_SECRET: "your-access-key-secret"
  
  # Stripe支付
  STRIPE_SECRET_KEY: "sk_test_your-stripe-key"
  
  # 邮件服务
  SMTP_PASSWORD: "your-email-password"
  
  # Docker Registry
  DOCKER_REGISTRY_PASSWORD: "your-registry-password"
