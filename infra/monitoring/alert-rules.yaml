# 房探AI - 监控告警配置

# ==================== 告警规则 ====================

# CPU使用率告警
groups:
- name: fangtan-ai-alerts
  rules:
  # API Gateway CPU使用率
  - alert: FangtanAPICPUHigh
    expr: rate(container_cpu_usage_seconds_total{pod=~"fangtan-api-.*"}[5m]) > 0.8
    for: 5m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: "API Gateway CPU使用率过高"
      description: "API Gateway {{ $labels.pod }} CPU使用率超过80%"

  # API Gateway内存使用率
  - alert: FangtanAPIMemoryHigh
    expr: container_memory_working_set_bytes{pod=~"fangtan-api-.*"} / container_spec_memory_limit_bytes{pod=~"fangtan-api-.*"} > 0.85
    for: 5m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: "API Gateway内存使用率过高"
      description: "API Gateway {{ $labels.pod }} 内存使用率超过85%"

  # API Gateway响应延迟
  - alert: FangtanAPIResponseSlow
    expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{pod=~"fangtan-api-.*"}[5m])) > 2
    for: 5m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: "API响应延迟过高"
      description: "API Gateway 95%响应延迟超过2秒"

  # API Gateway错误率
  - alert: FangtanAPIErrorRateHigh
    expr: rate(http_requests_total{pod=~"fangtan-api-.*",status=~"5.."}[5m]) / rate(http_requests_total{pod=~"fangtan-api-.*"}[5m]) > 0.05
    for: 5m
    labels:
      severity: critical
      team: platform
    annotations:
      summary: "API错误率过高"
      description: "API Gateway 5xx错误率超过5%"

  # 数据库连接数
  - alert: FangtanDatabaseConnectionsHigh
    expr: pg_stat_activity_count / pg_settings_max_connections > 0.8
    for: 5m
    labels:
      severity: warning
      team: database
    annotations:
      summary: "PostgreSQL连接数过高"
      description: "PostgreSQL连接数超过80%"

  # Redis内存使用率
  - alert: FangtanRedisMemoryHigh
    expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
    for: 5m
    labels:
      severity: warning
      team: database
    annotations:
      summary: "Redis内存使用率过高"
      description: "Redis内存使用率超过85%"

  # Kafka消费延迟
  - alert: FangtanKafkaConsumerLag
    expr: kafka_consumer_group_lag{group_id=~"fangtan.*"} > 1000
    for: 10m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: "Kafka消费延迟过高"
      description: "Kafka消费组延迟超过1000条消息"

  # Pod重启
  - alert: FangtanPodRestarting
    expr: increase(kube_pod_container_status_restarts_total[1h]) > 3
    for: 5m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: "Pod频繁重启"
      description: "Pod {{ $labels.namespace }}/{{ $labels.pod }}在过去1小时内重启超过3次"

  # HPA未生效
  - alert: FangtanHPANotWorking
    expr: kube_hpa_status_current_replicas != kube_hpa_spec_min_replicas
    for: 10m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: "HPA未按预期扩缩容"
      description: "HPA {{ $labels.name }} 当前副本数不等于最小副本数"

# ==================== 通知渠道 ====================

# 邮件通知
receivers:
- name: default
  email_configs:
    send_resolved: true
    to: "alerts@fangtan.ai"
    headers:
      From: "Prometheus <prometheus@fangtan.ai>"
      Subject: "[Fangtan AI] 告警通知"

# Slack通知
- name: slack
  slack_configs:
    send_resolved: true
    channel: "#alerts"
    api_url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"

# 钉钉通知
- name: dingtalk
  dingtalk_configs:
    send_resolved: true
    url: "https://oapi.dingtalk.com/robot/send?access_token=YOUR_TOKEN"

# 企业微信通知
- name: wechat
  wechat_configs:
    send_resolved: true
    corp_id: "YOUR_CORP_ID"
    to_user: "@all"
    agent_id: "YOUR_AGENT_ID"
    api_secret: "YOUR_API_SECRET"

route:
  group_by: ['alertname', 'severity']
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: slack
      continue: true
    - match:
        severity: warning
      receiver: default
      continue: true
