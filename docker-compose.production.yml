version: '3.8'

services:
  # PostgreSQL - 核心业务数据库
  postgres:
    image: postgres:15-alpine
    container_name: fangtan-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fangtan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fangtan_password}
      POSTGRES_DB: ${POSTGRES_DB:-fangtan_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fangtan} -d ${POSTGRES_DB:-fangtan_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fangtan-network

  # Redis - 缓存和会话
  redis:
    image: redis:7-alpine
    container_name: fangtan-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-fangtan_redis_password}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fangtan-network

  # API Gateway
  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile
    container_name: fangtan-api-gateway
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-fangtan}:${POSTGRES_PASSWORD:-fangtan_password}@postgres:5432/${POSTGRES_DB:-fangtan_prod}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:-fangtan_redis_password}@redis:6379
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-24h}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fangtan-network

  # Web Frontend
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: fangtan-web
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    restart: unless-stopped
    networks:
      - fangtan-network

volumes:
  postgres_data:
  redis_data:

networks:
  fangtan-network:
    driver: bridge
