version: '3.8'

# 房探AI生产环境Docker Compose配置
# 使用外部托管服务（阿里云RDS、Redis、OSS等）

services:
  # API Gateway - 核心业务服务
  api-gateway:
    image: ${DOCKER_REGISTRY:-registry.cn-hangzhou.aliyuncs.com}/fangtan-ai/api-gateway:${IMAGE_TAG:-latest}
    container_name: fangtan-api-gateway
    environment:
      - NODE_ENV=production
      - PORT=3001
      # 数据库连接（使用阿里云RDS）
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?schema=public
      # Redis连接（使用阿里云Redis）
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}
      # MongoDB连接
      - MONGODB_URL=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/${MONGO_DB}
      # Elasticsearch连接
      - ELASTICSEARCH_URL=http://${ES_HOST}:${ES_PORT}
      # JWT配置
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - REFRESH_TOKEN_EXPIRES_IN=30d
      # 功能配置
      - LOG_LEVEL=info
      - ENABLE_MOCK_DATA=false
      # CORS配置
      - CORS_ORIGIN=${CORS_ORIGIN:-https://fangtan.ai,https://www.fangtan.ai}
      # API Keys
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AMAP_KEY=${AMAP_KEY}
      # 支付配置
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    ports:
      - "3001:3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - fangtan-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '500m'
          memory: 512M

  # Web Frontend - Next.js应用
  web:
    image: ${DOCKER_REGISTRY:-registry.cn-hangzhou.aliyuncs.com}/fangtan-ai/web:${IMAGE_TAG:-latest}
    container_name: fangtan-web
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.fangtan.ai}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://fangtan.ai}
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - api-gateway
    networks:
      - fangtan-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '200m'
          memory: 256M

  # Worker - 后台任务处理
  worker:
    image: ${DOCKER_REGISTRY:-registry.cn-hangzhou.aliyuncs.com}/fangtan-ai/worker:${IMAGE_TAG:-latest}
    container_name: fangtan-worker
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD}@${REDIS_HOST}:${REDIS_PORT}
      - MONGODB_URL=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/${MONGO_DB}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - JWT_SECRET=${JWT_SECRET}
    command: npm run worker
    restart: unless-stopped
    depends_on:
      - api-gateway
    networks:
      - fangtan-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '500m'
          memory: 512M

  # Prometheus - 监控数据收集
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: fangtan-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - fangtan-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  # Grafana - 监控可视化
  grafana:
    image: grafana/grafana:10.2.0
    container_name: fangtan-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - fangtan-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # Alertmanager - 告警管理
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: fangtan-alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    restart: unless-stopped
    networks:
      - fangtan-network
    deploy:
      resources:
        limits:
          cpus: '500m'
          memory: 512M

  # Loki - 日志聚合
  loki:
    image: grafana/loki:2.9.0
    container_name: fangtan-loki
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks:
      - fangtan-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # Promtail - 日志收集
  promtail:
    image: grafana/promtail:2.9.0
    container_name: fangtan-promtail
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    restart: unless-stopped
    networks:
      - fangtan-network
    depends_on:
      - loki

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
  loki_data:
    driver: local

networks:
  fangtan-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
