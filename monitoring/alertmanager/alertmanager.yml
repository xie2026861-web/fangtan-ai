# 房探AI Alertmanager配置
global:
  resolve_timeout: 5m

# 路由配置
route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    # 关键告警立即通知
    - match:
        severity: critical
      receiver: 'critical'
      group_wait: 0s
      repeat_interval: 1h
    
    # 警告告警
    - match:
        severity: warning
      receiver: 'warning'
      group_wait: 1m
    
    # 按团队路由
    - match:
        team: 'backend'
      receiver: 'backend-team'
    - match:
        team: 'frontend'
      receiver: 'frontend-team'
    - match:
        team: 'infrastructure'
      receiver: 'infrastructure-team'

# 抑制规则
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

# 接收者配置
receivers:
  # 默认接收者
  - name: 'default'
    webhook_configs:
      - url: 'http://webhook-server:5000/alert/default'
        send_resolved: true

  # 关键告警接收者
  - name: 'critical'
    webhook_configs:
      - url: 'http://webhook-server:5000/alert/critical'
        send_resolved: true
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        severity: critical

  # 警告告警接收者
  - name: 'warning'
    webhook_configs:
      - url: 'http://webhook-server:5000/alert/warning'
        send_resolved: true

  # 团队接收者
  - name: 'backend-team'
    webhook_configs:
      - url: 'http://webhook-server:5000/alert/backend'
        send_resolved: true

  - name: 'frontend-team'
    webhook_configs:
      - url: 'http://webhook-server:5000/alert/frontend'
        send_resolved: true

  - name: 'infrastructure-team'
    webhook_configs:
      - url: 'http://webhook-server:5000/alert/infrastructure'
        send_resolved: true

# 钉钉通知配置示例
- name: 'dingtalk'
  webhook_configs:
    - url: 'https://oapi.dingtalk.com/robot/send?access_token=${DINGTALK_ACCESS_TOKEN}'
      send_resolved: true
      http_config:
        headers:
          Content-Type: 'application/json'
